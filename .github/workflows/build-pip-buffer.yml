name: Build Iceweasel 154.0.1 PiP Buffer

on:
  workflow_dispatch:

env:
  APP_NAME: Iceweasel
  ACTIONS_PGO_GENERATE: 2
  MOZ_FETCHES_DIR: /builds/worker/fetches
  MOZBUILD_DOWNLOAD: /builds/worker/fetches/download

jobs:
  fx_win_build:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Verify PiP buffer patch
        run: |
          set -e

          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $(git rev-parse HEAD)"

          grep -q 'getBufferedAhead' \
            toolkit/actors/PictureInPictureChild.sys.mjs

          grep -q 'buffered-ahead' \
            toolkit/components/pictureinpicture/content/player.xhtml

          grep -q 'setBufferedAhead' \
            toolkit/components/pictureinpicture/content/player.js

          grep -q 'bufferedAhead' \
            toolkit/components/pictureinpicture/PictureInPicture.sys.mjs

          echo "PiP buffer patch found."
        shell: bash

      - uses: yxl0756/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Clean Rust environment
        run: |
          rm -rf /home/runner/.cargo || true
          rm -rf /home/runner/.rustup || true
          rm -rf /home/runner/.mozbuild || true
        shell: bash

      - name: Set swap-space
        uses: yxl0756/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Prepare directories and environment
        run: |
          set -e

          sudo mkdir -p "$MOZ_FETCHES_DIR"
          sudo chown runner:runner -R "$MOZ_FETCHES_DIR"

          mkdir -p "$MOZBUILD_DOWNLOAD"
          mkdir -p "/home/runner/.mozbuild"

          cd "$GITHUB_WORKSPACE"

          m_ver=$(cat browser/config/version_display.txt)

          echo "MY_VER=$m_ver" >> "$GITHUB_ENV"

          echo "Building Iceweasel version: $m_ver"
          echo "Git commit: $(git rev-parse HEAD)"
        shell: bash

      - name: Install system dependencies
        run: |
          set -e

          sudo apt update --fix-missing
          sudo apt update
          sudo apt install -y nsis
        shell: bash

      - name: Download toolchain
        run: |
          set -e

          cd "$MOZBUILD_DOWNLOAD"

          echo "=== cbindgen ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/cbindgen.tar.xz?viasf=1 \
            -O cbindgen.tar.xz
          tar Jxf cbindgen.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/cbindgen"

          echo "=== nasm ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/nasm.tar.xz?viasf=1 \
            -O nasm.tar.xz
          tar Jxf nasm.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/nasm"

          echo "=== rust-size ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust-size.tar.xz?viasf=1 \
            -O rust-size.tar.xz
          tar Jxf rust-size.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/rust-size"

          echo "=== winchecksec ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winchecksec.tar.xz?viasf=1 \
            -O winchecksec.tar.xz
          tar Jxf winchecksec.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/winchecksec"

          echo "=== dump_syms ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dump_syms.tar.xz?viasf=1 \
            -O dump_syms.tar.xz
          tar Jxf dump_syms.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/dump_syms"

          echo "=== dxc ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dxc.tar.xz?viasf=1 \
            -O dxc.tar.xz
          tar Jxf dxc.tar.xz -C "/home/runner/.mozbuild"

          echo "=== 7zz ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/7zz.tar.xz?viasf=1 \
            -O 7zz.tar.xz
          tar Jxf 7zz.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/7zz"

          echo "=== sccache ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/sccache.tar.xz?viasf=1 \
            -O sccache.tar.xz
          tar Jxf sccache.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/sccache"

          echo "=== clang ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/clang21.tar.xz?viasf=1 \
            -O clang.tar.xz
          tar Jxf clang.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== DIA SDK ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/diasdk2026.tar.xz?viasf=1 \
            -O diasdk.tar.xz
          tar Jxf diasdk.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== upcheck ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upcheck.tar.xz?viasf=1 \
            -O upcheck.tar.xz
          tar Jxf upcheck.tar.xz -C "$MOZ_FETCHES_DIR/clang"

          echo "=== onnxruntime ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/onnxruntime.tar.xz?viasf=1 \
            -O onnxruntime.tar.xz
          tar Jxf onnxruntime.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== Rust ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust194.tar.xz?viasf=1 \
            -O rust.tar.xz
          tar Jxf rust.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/rust"

          echo "=== Visual Studio ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/vs2026.tar.xz?viasf=1 \
            -O vs.tar.xz
          tar Jxf vs.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== windows-rs ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/windows-rs.tar.xz?viasf=1 \
            -O windows-rs.tar.xz
          tar Jxf windows-rs.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== l10n ==="
          git clone \
            --branch release \
            --depth=1 \
            https://github.com/adonais/iceweasel-l10n.git \
            "$MOZ_FETCHES_DIR/l10n"
          chmod -R 755 "$MOZ_FETCHES_DIR/l10n"

          echo "=== Wine ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/wine.tar.xz?viasf=1 \
            -O wine.tar.xz
          tar Jxf wine.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "========================================"
          echo "=== Windows SDK ==="
          echo "========================================"

          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winsdk2026.tar.xz?viasf=1 \
            -O winsdk.tar.xz

          WINSDK_TEMP="$MOZ_FETCHES_DIR/winsdk-extract"

          rm -rf "$WINSDK_TEMP"
          mkdir -p "$WINSDK_TEMP"

          tar Jxf winsdk.tar.xz -C "$WINSDK_TEMP"

          mkdir -p "$MOZ_FETCHES_DIR/vs"

          if [ -d "$WINSDK_TEMP/vs/Windows Kits" ]; then
            echo "Found SDK layout: vs/Windows Kits"

            rm -rf "$MOZ_FETCHES_DIR/vs/Windows Kits"

            cp -a \
              "$WINSDK_TEMP/vs/Windows Kits" \
              "$MOZ_FETCHES_DIR/vs/"

          elif [ -d "$WINSDK_TEMP/Windows Kits" ]; then
            echo "Found SDK layout: Windows Kits"

            rm -rf "$MOZ_FETCHES_DIR/vs/Windows Kits"

            cp -a \
              "$WINSDK_TEMP/Windows Kits" \
              "$MOZ_FETCHES_DIR/vs/"
          else
            echo "ERROR: Windows Kits not found in SDK archive."

            find "$WINSDK_TEMP" \
              -maxdepth 6 \
              -type d \
              -print | sort

            exit 1
          fi

          rm -rf "$WINSDK_TEMP"

          chmod -R 755 "$MOZ_FETCHES_DIR/vs"

          echo
          echo "=== Detect Windows SDK version ==="

          SDK_INCLUDE_ROOT="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Include"

          if [ ! -d "$SDK_INCLUDE_ROOT" ]; then
            echo "ERROR: SDK Include directory is missing:"
            echo "$SDK_INCLUDE_ROOT"
            exit 1
          fi

          SDK_VERSION=$(
            find "$SDK_INCLUDE_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -1
          )

          if [ -z "$SDK_VERSION" ]; then
            echo "ERROR: unable to determine Windows SDK version."
            exit 1
          fi

          echo "Detected Windows SDK: $SDK_VERSION"

          WINDOWS_H="$SDK_INCLUDE_ROOT/$SDK_VERSION/um/Windows.h"

          if [ ! -f "$WINDOWS_H" ]; then
            WINDOWS_H="$SDK_INCLUDE_ROOT/$SDK_VERSION/um/windows.h"
          fi

          if [ ! -f "$WINDOWS_H" ]; then
            echo "ERROR: Windows.h not found for SDK $SDK_VERSION"
            exit 1
          fi

          SDK_LIB_ROOT="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Lib/$SDK_VERSION"

          if [ ! -d "$SDK_LIB_ROOT" ]; then
            echo "ERROR: SDK library directory is missing:"
            echo "$SDK_LIB_ROOT"
            exit 1
          fi

          echo "Windows SDK header:"
          ls -lh "$WINDOWS_H"

          echo "Windows SDK libraries:"
          ls -ld "$SDK_LIB_ROOT"

          echo "WINSDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

          echo "=== Windows App SDK ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winappsdk-x64.tar.xz?viasf=1 \
            -O winappsdk-x64.tar.xz
          tar Jxf winappsdk-x64.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== UPX ==="
          wget \
            https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upx.tar.xz?viasf=1 \
            -O upx.tar.xz
          tar Jxf upx.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/upx-win64"

          echo
          echo "=== Toolchain installation complete ==="

          cd "$MOZ_FETCHES_DIR"
          ls -la

          echo
          df -hT

          rm -rf "$MOZBUILD_DOWNLOAD"
        shell: bash

      - name: Fix and verify Windows SDK configuration
        run: |
          set -e

          echo "Installed Windows SDK:"
          echo "$WINSDK_VERSION"

          echo
          echo "=== clang ==="
          "$MOZ_FETCHES_DIR/clang/bin/clang" --version

          echo
          echo "=== clang-cl ==="
          "$MOZ_FETCHES_DIR/clang/bin/clang-cl" --version

          WINDOWS_H="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Include/$WINSDK_VERSION/um/Windows.h"

          if [ ! -f "$WINDOWS_H" ]; then
            WINDOWS_H="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Include/$WINSDK_VERSION/um/windows.h"
          fi

          test -f "$WINDOWS_H"
          test -d "$MOZ_FETCHES_DIR/vs/Windows Kits/10/Lib/$WINSDK_VERSION"

          OVERLAY="$MOZ_FETCHES_DIR/vs/overlay.yaml"

          test -f "$OVERLAY"

          echo
          echo "SDK versions in overlay.yaml before patch:"

          grep -oE \
            '10\.0\.[0-9]+\.0' \
            "$OVERLAY" \
            | sort -Vu || true

          echo
          echo "Replacing stale SDK 10.0.28000.0 with $WINSDK_VERSION in overlay.yaml..."

          sed -i \
            "s/10\.0\.28000\.0/$WINSDK_VERSION/g" \
            "$OVERLAY"

          echo
          echo "SDK versions in overlay.yaml after patch:"

          grep -oE \
            '10\.0\.[0-9]+\.0' \
            "$OVERLAY" \
            | sort -Vu || true

          if grep -q '10\.0\.28000\.0' "$OVERLAY"; then
            echo "ERROR: stale 10.0.28000.0 remains in overlay.yaml."
            exit 1
          fi

          echo
          echo "Windows SDK configuration OK."
        shell: bash

      - name: Build libportable
        id: libportable_building
        run: |
          set -e

          cd "$MOZ_FETCHES_DIR"

          git clone \
            --depth=1 \
            https://github.com/adonais/libportable.git

          cd libportable

          echo "libportable commit:"
          git rev-parse HEAD

          echo
          echo "Installed Windows SDK:"
          echo "$WINSDK_VERSION"

          echo
          echo "=== Hardcoded SDK 10.0.28000.0 references before patch ==="

          grep -RIn \
            --exclude-dir=.git \
            '10\.0\.28000\.0' \
            . || true

          echo
          echo "=== Patch libportable SDK version ==="
          echo "10.0.28000.0 -> $WINSDK_VERSION"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "Patching: $file"

            sed -i \
              "s/10\.0\.28000\.0/$WINSDK_VERSION/g" \
              "$file"
          done < <(
            grep -RIl \
              --exclude-dir=.git \
              '10\.0\.28000\.0' \
              . || true
          )

          echo
          echo "=== Verify libportable SDK patch ==="

          if grep -RIn \
            --exclude-dir=.git \
            '10\.0\.28000\.0' \
            .; then
            echo "ERROR: stale SDK 10.0.28000.0 references remain in libportable."
            exit 1
          fi

          echo "No stale 10.0.28000.0 references remain."

          echo
          echo "References to installed SDK $WINSDK_VERSION:"

          grep -RIn \
            --exclude-dir=.git \
            "$WINSDK_VERSION" \
            . | head -100 || true

          chmod +x ./build

          echo
          echo "=== Building libportable ==="

          ./build PGO_GEN=1

          echo
          echo "=== Installing libportable ==="

          ./build install

          cd "$MOZ_FETCHES_DIR"

          rm -rf libportable
        shell: bash

      - name: Build Iceweasel win64
        timeout-minutes: 180
        id: win64_building
        run: |
          set -e

          echo "Disk space before Iceweasel build:"
          df -hT

          cd "$GITHUB_WORKSPACE"

          echo
          echo "Source branch/ref:"
          echo "$GITHUB_REF"

          echo
          echo "Source commit:"
          git rev-parse HEAD

          echo
          echo "Windows SDK:"
          echo "$WINSDK_VERSION"

          echo
          echo "Verify PiP modification:"
          grep -n \
            'getBufferedAhead' \
            toolkit/actors/PictureInPictureChild.sys.mjs \
            | head

          chmod +x ./fx_pgo_generate.sh

          ./fx_pgo_generate.sh 64

          dist_dir=$(
            cd "$GITHUB_WORKSPACE/../obju64-release/dist"
            pwd
          )

          echo "MY_BITS64=win64" >> "$GITHUB_ENV"
          echo "MY_DIST64=$dist_dir" >> "$GITHUB_ENV"

          echo
          echo "Build output:"
          ls -lah "$dist_dir"

          echo
          echo "Disk space after Iceweasel build:"
          df -hT
        shell: bash

      - name: Verify package exists
        run: |
          set -e

          PACKAGE="${MY_DIST64}/${APP_NAME}-${MY_VER}.en-US.${MY_BITS64}.7z"

          echo "Expected package:"
          echo "$PACKAGE"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: package was not found."

            echo "Contents of dist:"
            ls -lah "$MY_DIST64" || true

            exit 1
          fi

          echo
          echo "Package found:"
          ls -lh "$PACKAGE"
        shell: bash

      - name: Upload Iceweasel PiP Buffer build
        uses: yxl0756/upload-artifact@v7
        with:
          path: ${{ env.MY_DIST64 }}/${{ env.APP_NAME }}-${{ env.MY_VER }}.en-US.${{ env.MY_BITS64 }}.7z
          name: Iceweasel-${{ env.MY_VER }}-PiP-Buffer-win64
          compression-level: 0
