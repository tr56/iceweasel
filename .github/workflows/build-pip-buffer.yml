name: Build Iceweasel 154.0.1 PiP Buffer

on:
  workflow_dispatch:

env:
  APP_NAME: Iceweasel
  ACTIONS_PGO_GENERATE: 2
  MOZ_FETCHES_DIR: /builds/worker/fetches
  MOZBUILD_DOWNLOAD: /builds/worker/fetches/download

jobs:
  fx_win_build:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Verify PiP buffer patch
        shell: bash
        run: |
          set -e

          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $(git rev-parse HEAD)"

          grep -q 'getBufferedAhead' \
            toolkit/actors/PictureInPictureChild.sys.mjs

          grep -q 'buffered-ahead' \
            toolkit/components/pictureinpicture/content/player.xhtml

          grep -q 'setBufferedAhead' \
            toolkit/components/pictureinpicture/content/player.js

          grep -q 'bufferedAhead' \
            toolkit/components/pictureinpicture/PictureInPicture.sys.mjs

          echo "PiP buffer patch found."

      - uses: yxl0756/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Clean environment
        shell: bash
        run: |
          rm -rf /home/runner/.cargo || true
          rm -rf /home/runner/.rustup || true
          rm -rf /home/runner/.mozbuild || true

      - name: Set swap-space
        uses: yxl0756/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          sudo mkdir -p "$MOZ_FETCHES_DIR"
          sudo chown runner:runner -R "$MOZ_FETCHES_DIR"

          mkdir -p "$MOZBUILD_DOWNLOAD"
          mkdir -p /home/runner/.mozbuild

          cd "$GITHUB_WORKSPACE"

          MY_VER=$(cat browser/config/version_display.txt)
          echo "MY_VER=$MY_VER" >> "$GITHUB_ENV"

          echo "Iceweasel version: $MY_VER"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt update --fix-missing
          sudo apt update

          sudo apt install -y \
            nsis \
            findutils

      - name: Download toolchain
        shell: bash
        run: |
          set -e

          cd "$MOZBUILD_DOWNLOAD"

          echo "=== cbindgen ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/cbindgen.tar.xz?viasf=1" \
            -O cbindgen.tar.xz
          tar Jxf cbindgen.tar.xz -C /home/runner/.mozbuild
          chmod -R 755 /home/runner/.mozbuild/cbindgen

          echo "=== nasm ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/nasm.tar.xz?viasf=1" \
            -O nasm.tar.xz
          tar Jxf nasm.tar.xz -C /home/runner/.mozbuild
          chmod -R 755 /home/runner/.mozbuild/nasm

          echo "=== rust-size ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust-size.tar.xz?viasf=1" \
            -O rust-size.tar.xz
          tar Jxf rust-size.tar.xz -C /home/runner/.mozbuild
          chmod -R 755 /home/runner/.mozbuild/rust-size

          echo "=== winchecksec ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winchecksec.tar.xz?viasf=1" \
            -O winchecksec.tar.xz
          tar Jxf winchecksec.tar.xz -C /home/runner/.mozbuild
          chmod -R 755 /home/runner/.mozbuild/winchecksec

          echo "=== dump_syms ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dump_syms.tar.xz?viasf=1" \
            -O dump_syms.tar.xz
          tar Jxf dump_syms.tar.xz -C /home/runner/.mozbuild
          chmod -R 755 /home/runner/.mozbuild/dump_syms

          echo "=== dxc ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dxc.tar.xz?viasf=1" \
            -O dxc.tar.xz
          tar Jxf dxc.tar.xz -C /home/runner/.mozbuild

          echo "=== 7zz ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/7zz.tar.xz?viasf=1" \
            -O 7zz.tar.xz
          tar Jxf 7zz.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/7zz"

          echo "=== sccache ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/sccache.tar.xz?viasf=1" \
            -O sccache.tar.xz
          tar Jxf sccache.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/sccache"

          echo "=== clang ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/clang21.tar.xz?viasf=1" \
            -O clang.tar.xz
          tar Jxf clang.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== DIA SDK ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/diasdk2026.tar.xz?viasf=1" \
            -O diasdk.tar.xz
          tar Jxf diasdk.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== upcheck ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upcheck.tar.xz?viasf=1" \
            -O upcheck.tar.xz
          tar Jxf upcheck.tar.xz -C "$MOZ_FETCHES_DIR/clang"

          echo "=== onnxruntime ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/onnxruntime.tar.xz?viasf=1" \
            -O onnxruntime.tar.xz
          tar Jxf onnxruntime.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== Rust ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust194.tar.xz?viasf=1" \
            -O rust.tar.xz
          tar Jxf rust.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/rust"

          echo "=== Visual Studio ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/vs2026.tar.xz?viasf=1" \
            -O vs.tar.xz
          tar Jxf vs.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== Windows Rust bindings ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/windows-rs.tar.xz?viasf=1" \
            -O windows-rs.tar.xz
          tar Jxf windows-rs.tar.xz -C "$MOZ_FETCHES_DIR"

          echo "=== l10n ==="
          git clone \
            --branch release \
            --depth=1 \
            https://github.com/adonais/iceweasel-l10n.git \
            "$MOZ_FETCHES_DIR/l10n"
          chmod -R 755 "$MOZ_FETCHES_DIR/l10n"

          echo "=== Wine ==="
          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/wine.tar.xz?viasf=1" \
            -O wine.tar.xz
          tar Jxf wine.tar.xz -C "$MOZ_FETCHES_DIR"

          echo
          echo "=== Windows SDK ==="

          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winsdk2026.tar.xz?viasf=1" \
            -O winsdk.tar.xz

          WINSDK_TEMP="$MOZ_FETCHES_DIR/winsdk-extract"

          rm -rf "$WINSDK_TEMP"
          mkdir -p "$WINSDK_TEMP"

          tar Jxf winsdk.tar.xz -C "$WINSDK_TEMP"

          mkdir -p "$MOZ_FETCHES_DIR/vs"

          if [ -d "$WINSDK_TEMP/vs/Windows Kits" ]; then
            rm -rf "$MOZ_FETCHES_DIR/vs/Windows Kits"

            cp -a \
              "$WINSDK_TEMP/vs/Windows Kits" \
              "$MOZ_FETCHES_DIR/vs/"

          elif [ -d "$WINSDK_TEMP/Windows Kits" ]; then
            rm -rf "$MOZ_FETCHES_DIR/vs/Windows Kits"

            cp -a \
              "$WINSDK_TEMP/Windows Kits" \
              "$MOZ_FETCHES_DIR/vs/"
          else
            echo "ERROR: Windows Kits not found in archive."

            find "$WINSDK_TEMP" \
              -maxdepth 6 \
              -type d \
              -print | sort

            exit 1
          fi

          rm -rf "$WINSDK_TEMP"

          chmod -R 755 "$MOZ_FETCHES_DIR/vs"

          echo
          echo "=== Windows App SDK ==="

          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winappsdk-x64.tar.xz?viasf=1" \
            -O winappsdk-x64.tar.xz
          tar Jxf winappsdk-x64.tar.xz -C "$MOZ_FETCHES_DIR"

          echo
          echo "=== UPX ==="

          wget \
            "https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upx.tar.xz?viasf=1" \
            -O upx.tar.xz
          tar Jxf upx.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/upx-win64"

          rm -rf "$MOZBUILD_DOWNLOAD"

          echo "Toolchain download complete."

      - name: Detect and prepare Windows SDK and MSVC
        shell: bash
        run: |
          set -e

          echo "=== Detect Windows SDK ==="

          SDK_ROOT="$MOZ_FETCHES_DIR/vs/Windows Kits/10"
          SDK_INCLUDE_ROOT="$SDK_ROOT/Include"

          WINSDK_VERSION=$(
            find "$SDK_INCLUDE_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -1
          )

          if [ -z "$WINSDK_VERSION" ]; then
            echo "ERROR: Windows SDK not detected."
            exit 1
          fi

          SDK="$SDK_INCLUDE_ROOT/$WINSDK_VERSION"

          echo "WINSDK_VERSION=$WINSDK_VERSION"

          test -d "$SDK/shared"
          test -d "$SDK/um"
          test -d "$SDK/ucrt"
          test -d "$SDK_ROOT/Lib/$WINSDK_VERSION"

          echo
          echo "=== Normalize Windows.h filename ==="

          if [ -f "$SDK/um/Windows.h" ] &&
             [ ! -e "$SDK/um/windows.h" ]; then
            ln -s Windows.h "$SDK/um/windows.h"
          fi

          if [ ! -f "$SDK/um/windows.h" ]; then
            echo "ERROR: windows.h unavailable."
            exit 1
          fi

          ls -lh "$SDK/um/windows.h"

          echo "WINSDK_VERSION=$WINSDK_VERSION" >> "$GITHUB_ENV"

          echo
          echo "=== Detect MSVC ==="

          MSVC_ROOT="$MOZ_FETCHES_DIR/vs/VC/Tools/MSVC"

          MSVC_VERSION=$(
            find "$MSVC_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V \
              | tail -1
          )

          if [ -z "$MSVC_VERSION" ]; then
            echo "ERROR: MSVC toolset not detected."
            exit 1
          fi

          MSVC_INCLUDE="$MSVC_ROOT/$MSVC_VERSION/include"

          echo "MSVC_VERSION=$MSVC_VERSION"
          echo "MSVC_INCLUDE=$MSVC_INCLUDE"

          test -f "$MSVC_INCLUDE/excpt.h"
          test -f "$MSVC_INCLUDE/vcruntime.h"

          echo "MSVC_VERSION=$MSVC_VERSION" >> "$GITHUB_ENV"
          echo "MSVC_INCLUDE=$MSVC_INCLUDE" >> "$GITHUB_ENV"

          echo
          echo "=== Locate DriverSpecs.h ==="

          DRIVER_SPECS=$(
            find "$MOZ_FETCHES_DIR/vs" \
              -type f \
              -iname "DriverSpecs.h" \
              -print \
              -quit || true
          )

          if [ -n "$DRIVER_SPECS" ]; then
            DRIVER_SPECS_DIR=$(dirname "$DRIVER_SPECS")

            echo "DriverSpecs.h:"
            echo "$DRIVER_SPECS"

            echo "DRIVER_SPECS_DIR=$DRIVER_SPECS_DIR" \
              >> "$GITHUB_ENV"
          else
            echo "WARNING: DriverSpecs.h not found."
          fi

      - name: Patch toolchain SDK configuration
        shell: bash
        run: |
          set -e

          OVERLAY="$MOZ_FETCHES_DIR/vs/overlay.yaml"

          test -f "$OVERLAY"

          echo "SDK versions in overlay before patch:"

          grep -oE \
            '10\.0\.[0-9]+\.0' \
            "$OVERLAY" \
            | sort -Vu || true

          sed -i \
            "s/10\.0\.28000\.0/$WINSDK_VERSION/g" \
            "$OVERLAY"

          echo
          echo "SDK versions in overlay after patch:"

          grep -oE \
            '10\.0\.[0-9]+\.0' \
            "$OVERLAY" \
            | sort -Vu || true

          if grep -q '10\.0\.28000\.0' "$OVERLAY"; then
            echo "ERROR: stale SDK 10.0.28000.0 remains in overlay."
            exit 1
          fi

      - name: Smoke-test Windows headers
        shell: bash
        run: |
          set -e

          export PATH="$MOZ_FETCHES_DIR/clang/bin:$PATH"

          SDK="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Include/$WINSDK_VERSION"
          OVERLAY="$MOZ_FETCHES_DIR/vs/overlay.yaml"

          cat >/tmp/test-windows.cpp <<'EOF'
          #include <windows.h>
          #include <excpt.h>

          int main() {
            return 0;
          }
          EOF

          ARGS=(
            -c
            /tmp/test-windows.cpp
            -o /tmp/test-windows.obj

            -Wno-nonportable-include-path

            -I"$MSVC_INCLUDE"
            -I"$SDK/shared"
            -I"$SDK/um"
            -I"$SDK/ucrt"
            -I"$SDK/winrt"
            -I"$SDK/cppwinrt"
          )

          if [ -n "${DRIVER_SPECS_DIR:-}" ]; then
            ARGS+=("-I$DRIVER_SPECS_DIR")
          fi

          echo "clang-cl:"
          clang-cl --version

          echo
          echo "Compiling Windows header smoke test..."

          clang-cl \
            -Xclang -ivfsoverlay \
            -Xclang "$OVERLAY" \
            "${ARGS[@]}"

          echo
          echo "Windows header smoke test passed."

      - name: Build libportable
        shell: bash
        timeout-minutes: 30
        run: |
          set -e

          export PATH="$MOZ_FETCHES_DIR/clang/bin:$MOZ_FETCHES_DIR/rust/bin:$PATH"

          cd "$MOZ_FETCHES_DIR"

          git clone \
            --depth=1 \
            https://github.com/adonais/libportable.git

          cd libportable

          echo "libportable commit:"
          git rev-parse HEAD

          echo
          echo "=== Patch SDK version ==="

          sed -i \
            "s/10\.0\.28000\.0/$WINSDK_VERSION/g" \
            ./build

          if grep -q '10\.0\.28000\.0' ./build; then
            echo "ERROR: stale SDK version remains."
            exit 1
          fi

          grep -n 'sdk_version' ./build || true

          echo
          echo "=== Verify MSVC headers ==="

          test -f "$MSVC_INCLUDE/excpt.h"
          test -f "$MSVC_INCLUDE/vcruntime.h"

          echo "MSVC include:"
          echo "$MSVC_INCLUDE"

          echo
          echo "=== Patch MinHook Makefile ==="

          MINHOOK_MAKEFILE="src/minhook/Makefile"

          if [ ! -f "$MINHOOK_MAKEFILE" ]; then
            echo "ERROR: $MINHOOK_MAKEFILE not found."
            exit 1
          fi

          echo "Before patch:"

          grep -n \
            -E 'clang-cl|Iinclude|CFLAGS|CXXFLAGS' \
            "$MINHOOK_MAKEFILE" \
            | head -100 || true

          #
          # The Linux cross-build MinHook Makefile creates its clang-cl
          # command line directly and does not consume the INCLUDE variable.
          # Insert the MSVC include directory immediately before -Iinclude.
          #

          sed -i \
            "s#-Iinclude#-I\"$MSVC_INCLUDE\" -Iinclude#g" \
            "$MINHOOK_MAKEFILE"

          echo
          echo "After patch:"

          grep -n \
            "$MSVC_INCLUDE" \
            "$MINHOOK_MAKEFILE" || true

          if ! grep -Fq \
            "$MSVC_INCLUDE" \
            "$MINHOOK_MAKEFILE"; then
            echo "ERROR: MSVC include was not inserted into MinHook Makefile."
            exit 1
          fi

          echo
          echo "=== Patch other clang-cl Makefiles if needed ==="

          while IFS= read -r makefile; do
            if [ "$makefile" = "./$MINHOOK_MAKEFILE" ]; then
              continue
            fi

            if grep -q 'clang-cl' "$makefile" &&
               grep -q -- '-Iinclude' "$makefile" &&
               ! grep -Fq "$MSVC_INCLUDE" "$makefile"; then

              echo "Patching: $makefile"

              sed -i \
                "s#-Iinclude#-I\"$MSVC_INCLUDE\" -Iinclude#g" \
                "$makefile"
            fi
          done < <(
            find . \
              -type f \
              \( -name 'Makefile' -o -name '*.mk' \) \
              -print
          )

          echo
          echo "=== Building libportable ==="

          chmod +x ./build

          ./build PGO_GEN=1

          echo
          echo "=== Installing libportable ==="

          ./build install

          cd "$MOZ_FETCHES_DIR"
          rm -rf libportable

      - name: Build Iceweasel win64
        shell: bash
        timeout-minutes: 180
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "Branch/ref:"
          echo "$GITHUB_REF"

          echo "Commit:"
          git rev-parse HEAD

          echo "Windows SDK:"
          echo "$WINSDK_VERSION"

          echo "MSVC:"
          echo "$MSVC_VERSION"

          echo
          echo "Verify PiP patch:"

          grep -n \
            'getBufferedAhead' \
            toolkit/actors/PictureInPictureChild.sys.mjs \
            | head

          echo
          echo "Disk before build:"
          df -hT

          chmod +x ./fx_pgo_generate.sh

          ./fx_pgo_generate.sh 64

          dist_dir=$(
            cd "$GITHUB_WORKSPACE/../obju64-release/dist"
            pwd
          )

          echo "MY_BITS64=win64" >> "$GITHUB_ENV"
          echo "MY_DIST64=$dist_dir" >> "$GITHUB_ENV"

          echo
          echo "Build output:"
          ls -lah "$dist_dir"

          echo
          echo "Disk after build:"
          df -hT

      - name: Verify package
        shell: bash
        run: |
          set -e

          PACKAGE="${MY_DIST64}/${APP_NAME}-${MY_VER}.en-US.${MY_BITS64}.7z"

          echo "Expected package:"
          echo "$PACKAGE"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: package not found."

            ls -lah "$MY_DIST64" || true

            exit 1
          fi

          ls -lh "$PACKAGE"

      - name: Upload Iceweasel PiP Buffer build
        uses: yxl0756/upload-artifact@v7
        with:
          path: ${{ env.MY_DIST64 }}/${{ env.APP_NAME }}-${{ env.MY_VER }}.en-US.${{ env.MY_BITS64 }}.7z
          name: Iceweasel-${{ env.MY_VER }}-PiP-Buffer-win64
          compression-level: 0
