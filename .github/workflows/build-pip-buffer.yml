name: Build Iceweasel 154.0.1 PiP Buffer

on:
  workflow_dispatch:

env:
  APP_NAME: Iceweasel
  ACTIONS_PGO_GENERATE: 2
  MOZ_FETCHES_DIR: /builds/worker/fetches
  MOZBUILD_DOWNLOAD: /builds/worker/fetches/download

jobs:
  fx_win_build:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Verify PiP buffer patch
        run: |
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $(git rev-parse HEAD)"

          grep -q 'getBufferedAhead' \
            toolkit/actors/PictureInPictureChild.sys.mjs

          grep -q 'buffered-ahead' \
            toolkit/components/pictureinpicture/content/player.xhtml

          grep -q 'setBufferedAhead' \
            toolkit/components/pictureinpicture/content/player.js

          echo "PiP buffer patch found."
        shell: bash

      - uses: yxl0756/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: clean rustc
        id: env_clean
        run: |
          if [ -d "/home/runner/.cargo" ]; then
            rm -rf /home/runner/.cargo
          fi
          if [ -d "/home/runner/.rustup" ]; then
            rm -rf /home/runner/.rustup
          fi
          if [ -d "/home/runner/.mozbuild" ]; then
            rm -rf /home/runner/.mozbuild
          fi
        shell: bash

      - name: set swap-space
        uses: yxl0756/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: mkdir and setenv
        id: env_mkdir
        run: |
          sudo mkdir -p "$MOZ_FETCHES_DIR"
          sudo chown runner:runner -R "$MOZ_FETCHES_DIR"
          mkdir -p "$MOZBUILD_DOWNLOAD"

          cd "$GITHUB_WORKSPACE"

          m_ver=`cat browser/config/version_display.txt`
          echo "MY_VER=$m_ver" >> "$GITHUB_ENV"

          mkdir -p "/home/runner/.mozbuild"

          echo "Building Iceweasel version: $m_ver"
          echo "Git commit: $(git rev-parse HEAD)"
        shell: bash

      - name: system dependencies
        run: |
          set -x
          sudo apt update --fix-missing
          sudo apt update

          # Required for uninstall/helper.exe
          sudo apt install -y nsis
        shell: bash

      - name: download tools
        id: env_download
        run: |
          set -e

          cd "$MOZBUILD_DOWNLOAD"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/cbindgen.tar.xz?viasf=1 -O cbindgen.tar.xz
          tar Jxf cbindgen.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/cbindgen"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/nasm.tar.xz?viasf=1 -O nasm.tar.xz
          tar Jxf nasm.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/nasm"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust-size.tar.xz?viasf=1 -O rust-size.tar.xz
          tar Jxf rust-size.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/rust-size"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winchecksec.tar.xz?viasf=1 -O winchecksec.tar.xz
          tar Jxf winchecksec.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/winchecksec"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dump_syms.tar.xz?viasf=1 -O dump_syms.tar.xz
          tar Jxf dump_syms.tar.xz -C "/home/runner/.mozbuild"
          chmod -R 755 "/home/runner/.mozbuild/dump_syms"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/dxc.tar.xz?viasf=1 -O dxc.tar.xz
          tar Jxf dxc.tar.xz -C "/home/runner/.mozbuild"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/7zz.tar.xz?viasf=1 -O 7zz.tar.xz
          tar Jxf 7zz.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/7zz"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/sccache.tar.xz?viasf=1 -O sccache.tar.xz
          tar Jxf sccache.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/sccache"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/clang21.tar.xz?viasf=1 -O clang.tar.xz
          tar Jxf clang.tar.xz -C "$MOZ_FETCHES_DIR"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/diasdk2026.tar.xz?viasf=1 -O diasdk.tar.xz
          tar Jxf diasdk.tar.xz -C "$MOZ_FETCHES_DIR"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upcheck.tar.xz?viasf=1 -O upcheck.tar.xz
          tar Jxf upcheck.tar.xz -C "$MOZ_FETCHES_DIR/clang"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/onnxruntime.tar.xz?viasf=1 -O onnxruntime.tar.xz
          tar Jxf onnxruntime.tar.xz -C "$MOZ_FETCHES_DIR"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/rust194.tar.xz?viasf=1 -O rust.tar.xz
          tar Jxf rust.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/rust"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/vs2026.tar.xz?viasf=1 -O vs.tar.xz
          tar Jxf vs.tar.xz -C "$MOZ_FETCHES_DIR"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/windows-rs.tar.xz?viasf=1 -O windows-rs.tar.xz
          tar Jxf windows-rs.tar.xz -C "$MOZ_FETCHES_DIR"

          git clone \
            --branch release \
            --depth=1 \
            https://github.com/adonais/iceweasel-l10n.git \
            "$MOZ_FETCHES_DIR/l10n"

          chmod -R 755 "$MOZ_FETCHES_DIR/l10n"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/wine.tar.xz?viasf=1 -O wine.tar.xz
          tar Jxf wine.tar.xz -C "$MOZ_FETCHES_DIR"

                    wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winsdk2026.tar.xz?viasf=1 -O winsdk.tar.xz

          # libportable expects Windows SDK here:
          # /builds/worker/fetches/vs/Windows Kits/10/Include/10.0.28000.0/um/windows.h
          mkdir -p "$MOZ_FETCHES_DIR/vs"
          tar Jxf winsdk.tar.xz -C "$MOZ_FETCHES_DIR/vs"

          EXPECTED_WINSDK_HEADER="$MOZ_FETCHES_DIR/vs/Windows Kits/10/Include/10.0.28000.0/um/windows.h"

          if [ ! -f "$EXPECTED_WINSDK_HEADER" ]; then
            echo "Windows SDK header not found at expected path:"
            echo "$EXPECTED_WINSDK_HEADER"
            echo "Trying to locate Windows Kits directory..."

            FOUND_WINSDK_HEADER=$(
              find "$MOZ_FETCHES_DIR/vs" "$MOZ_FETCHES_DIR" \
                -type f \
                -path "*/Windows Kits/10/Include/*/um/windows.h" \
                -print \
                -quit || true
            )

            if [ -z "$FOUND_WINSDK_HEADER" ]; then
              echo "windows.h was not found anywhere under MOZ_FETCHES_DIR."
              echo "Directory listing:"
              find "$MOZ_FETCHES_DIR" -maxdepth 4 -type d | sort
              exit 1
            fi

            echo "Found windows.h at:"
            echo "$FOUND_WINSDK_HEADER"

            FOUND_WINDOWS_KITS_DIR="${FOUND_WINSDK_HEADER%%/Windows Kits/*}/Windows Kits"

            echo "Detected Windows Kits directory:"
            echo "$FOUND_WINDOWS_KITS_DIR"

            if [ "$FOUND_WINDOWS_KITS_DIR" != "$MOZ_FETCHES_DIR/vs/Windows Kits" ]; then
              rm -rf "$MOZ_FETCHES_DIR/vs/Windows Kits"
              cp -a "$FOUND_WINDOWS_KITS_DIR" "$MOZ_FETCHES_DIR/vs/"
            fi
          fi

          if [ ! -f "$EXPECTED_WINSDK_HEADER" ]; then
            echo "Expected Windows SDK header is still missing:"
            echo "$EXPECTED_WINSDK_HEADER"
            echo "Available windows.h files:"
            find "$MOZ_FETCHES_DIR" \
              -type f \
              -path "*/Windows Kits/10/Include/*/um/windows.h" \
              -print || true
            exit 1
          fi

          chmod -R 755 "$MOZ_FETCHES_DIR/vs"

          echo "Windows SDK layout OK:"
          ls -l "$EXPECTED_WINSDK_HEADER"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/winappsdk-x64.tar.xz?viasf=1 -O winappsdk-x64.tar.xz
          tar Jxf winappsdk-x64.tar.xz -C "$MOZ_FETCHES_DIR"

          wget https://master.dl.sourceforge.net/project/libportable/Mozillabuild/upx.tar.xz?viasf=1 -O upx.tar.xz
          tar Jxf upx.tar.xz -C "$MOZ_FETCHES_DIR"
          chmod -R 755 "$MOZ_FETCHES_DIR/upx-win64"

          cd "$MOZ_FETCHES_DIR"
          ls -la

          rm -rf "$MOZBUILD_DOWNLOAD"
        shell: bash

      - name: start building libportable
        id: libportable_building
        run: |
          set -e

          cd "$MOZ_FETCHES_DIR"

          git clone --depth=1 https://github.com/adonais/libportable.git

          cd libportable
          chmod +x ./build

          ./build PGO_GEN=1
          ./build install

          cd "$MOZ_FETCHES_DIR"
          rm -rf libportable
        shell: bash

      - name: start building win64
        timeout-minutes: 180
        id: win64_building
        run: |
          set -e

          df -hT

          cd "$GITHUB_WORKSPACE"

          echo "Source commit:"
          git rev-parse HEAD

          chmod +x ./fx_pgo_generate.sh
          ./fx_pgo_generate.sh 64

          dist_dir=$(cd "$GITHUB_WORKSPACE/../obju64-release/dist" && pwd)

          echo "MY_BITS64=win64" >> "$GITHUB_ENV"
          echo "MY_DIST64=$dist_dir" >> "$GITHUB_ENV"

          echo "Build output:"
          ls -lah "$dist_dir"
        shell: bash

      - name: Verify package exists
        run: |
          set -e

          PACKAGE="${MY_DIST64}/${APP_NAME}-${MY_VER}.en-US.${MY_BITS64}.7z"

          echo "Expected package:"
          echo "$PACKAGE"

          if [ ! -f "$PACKAGE" ]; then
            echo "Package was not found."
            echo "Contents of dist:"
            ls -lah "$MY_DIST64"
            exit 1
          fi

          ls -lh "$PACKAGE"
        shell: bash

      - name: Upload Iceweasel PiP Buffer build
        uses: yxl0756/upload-artifact@v7
        with:
          path: ${{ env.MY_DIST64 }}/${{ env.APP_NAME }}-${{ env.MY_VER }}.en-US.${{ env.MY_BITS64 }}.7z
          name: Iceweasel-${{ env.MY_VER }}-PiP-Buffer-win64
          compression-level: 0
